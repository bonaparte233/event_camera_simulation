name: Sync Project Page

on:
  pull_request:
    paths:
      - README.md
      - index.html
      - assets/**
      - scripts/**
      - .github/workflows/sync-page.yml
  push:
    branches:
      - main
    paths:
      - README.md
      - index.html
      - assets/**
      - scripts/**
      - .github/workflows/sync-page.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-project-page-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-page:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate project page blocks
        run: python scripts/sync_page.py

      - name: Validate repository
        run: python scripts/check_site.py

      - name: Require committed generated page in pull requests
        if: github.event_name == 'pull_request'
        run: git diff --exit-code

      - name: Commit generated page after main updates
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html already synchronized"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Sync project page from README"
            git push
          fi
